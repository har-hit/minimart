{% extends "base.html" %}{% block content %}<section class="detail"><img src="{{ product.image_url or 'https://placehold.co/600x400' }}" alt="{{ product.name }}"><div><p class="eyebrow">PRODUCT DETAILS</p><h1>{{ product.name }}</h1><p>{{ product.description }}</p><h2>₹{{ "%.2f"|format(product.price) }}</h2><p>{{ product.stock }} in stock</p><form method="post" action="/cart/add/{{ product.id }}"><input type="number" name="quantity" min="1" max="{{ product.stock }}" value="1"><button {% if product.stock == 0 %}disabled{% endif %}>Add to cart</button></form></div></section>{% endblock %}
