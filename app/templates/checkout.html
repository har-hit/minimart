{% extends "base.html" %}{% block title %}Checkout — MiniMart{% endblock %}{% block content %}<p class="eyebrow">ALMOST THERE</p><h1>Checkout</h1><div class="checkout"><form method="post" action="/checkout" class="checkout-form"><label>Full name<input name="customer_name" required></label><label>Email<input type="email" name="email" required></label><label>Delivery address<textarea name="address" rows="4" required></textarea></label><button>Place order</button></form><aside><h3>Order total</h3><h2>₹{{ "%.2f"|format(total) }}</h2>{% for row in rows %}<p>{{ row.product.name }} × {{ row.quantity }}</p>{% endfor %}</aside></div>{% endblock %}
